listen:
  - address: "0.0.0.0:8443"
    tls:
      enabled: true
      cert_file: "/etc/go-firewall/tls/server.crt"
      key_file: "/etc/go-firewall/tls/server.key"
  - address: "0.0.0.0:8080"
    tls:
      enabled: false

upstreams:
  addresses:
    - "http://10.0.1.10:8080"
    - "http://10.0.1.11:8080"
  dial_timeout: "2s"
  response_header_timeout: "10s"
  idle_conn_timeout: "90s"
  max_idle_conns_per_host: 100

ip_lists:
  allow: []            # empty = allow all (deny list is authoritative)
  deny:
    - "203.0.113.0/24"
    - "198.51.100.7/32"
  # If `allow` is non-empty, only those CIDRs may connect; everything else
  # is denied.
  geo:
    enabled: false
    db_path: "/etc/go-firewall/GeoLite2-Country.mmdb"
    # Example: restrict the firewall to Singapore-origin traffic only.
    # Every other country (and any IP the database can't resolve) is denied.
    allow_countries: ["SG"]

admin:
  enabled: true
  address: "127.0.0.1:9091"
  # Bearer token is read from this environment variable at startup, never
  # stored in this file.
  auth_token_env: "GOFIREWALL_ADMIN_TOKEN"

rate_limit:
  enabled: true
  default:
    requests_per_second: 20
    burst: 40
  per_route:
    - path_prefix: "/api/login"
      requests_per_second: 2
      burst: 5
  idle_ttl: "10m"

waf:
  enabled: true
  rules_file: "/etc/go-firewall/rules/default.yaml"
  body_inspection:
    max_bytes: 131072
  default_action: "block" # block | log-only (global dry-run override)

log:
  level: "info"
  access_log_path: "-"    # "-" = stdout
  format: "json"
  ring_buffer_size: 1000  # entries retained in memory for the admin dashboard

metrics:
  enabled: true
  address: "127.0.0.1:9090"
  path: "/metrics"

shutdown:
  drain_timeout: "30s"
